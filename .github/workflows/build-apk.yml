name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      # Works with the files in the repository root, in dinamix_app/ or in dinamix_app.zip.
      - name: Trova la cartella del progetto
        run: |
          if [ -f dinamix_app.zip ]; then
            # Files committed under dinamix_app/ take priority over the archive.
            unzip -q -n dinamix_app.zip
            # Fixes for the uploaded archive (already in the source).
            sed -i "s/_listen('Accelerometro'/_listen<Vector3Sample>('Accelerometro'/; s/_listen('Giroscopio'/_listen<Vector3Sample>('Giroscopio'/; s/_listen('Magnetometro'/_listen<Vector3Sample>('Magnetometro'/; s/_listen('Barometro'/_listen<double>('Barometro'/" dinamix_app/lib/ble/transport/phone_transport.dart
            sed -i "s#^import 'package:flutter/rendering.dart';#import 'package:flutter/rendering.dart';\nimport 'package:flutter/services.dart';#" dinamix_app/test/screenshots_test.dart
            sed -i '/await done;/d; s/await tester.pump();$/await tester.pump(const Duration(seconds: 1));/' dinamix_app/test/screenshots_test.dart
          fi
          if [ -f pubspec.yaml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f dinamix_app/pubspec.yaml ]; then
            echo "PROJECT_DIR=dinamix_app" >> "$GITHUB_ENV"
          else
            echo "::error::pubspec.yaml non trovato: i file del progetto non sono stati caricati correttamente."
            exit 1
          fi

      - name: Installa Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostra le versioni
        run: flutter --version

      - name: Genera i file Android mancanti
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --project-name dinamix --org com.dinamix .

      - name: Scarica le dipendenze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analisi del codice
        id: analyze
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Esegui i test
        id: tests
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Genera gli screenshot
        id: screenshots
        continue-on-error: true
        timeout-minutes: 6
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --update-goldens --dart-define=SCREENSHOTS=true --timeout=90s test/screenshots_test.dart

      - name: Pubblica gli screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ env.PROJECT_DIR }}/test/screenshots
          retention-days: 7
          if-no-files-found: warn

      - name: Compila l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Rinomina l'APK
        run: mv "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" dinamix.apk

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v7
        with:
          path: dinamix.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      # The APK stays downloadable, but failed checks are never hidden.
      - name: Esito di analisi e test
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "::error::APK creato, ma analisi o test non sono passati. Non considerarlo verificato."
          exit 1
