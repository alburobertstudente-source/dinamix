name: Compila APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      # Works with the files in the repository root, in dinamix_app/ or in dinamix_app.zip.
      - name: Trova la cartella del progetto
        run: |
          if [ -f dinamix_app.zip ]; then
            # Files committed under dinamix_app/ take priority over the archive.
            unzip -q -n dinamix_app.zip
          fi
          if [ -f pubspec.yaml ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f dinamix_app/pubspec.yaml ]; then
            echo "PROJECT_DIR=dinamix_app" >> "$GITHUB_ENV"
          else
            echo "::error::pubspec.yaml non trovato: i file del progetto non sono stati caricati correttamente."
            exit 1
          fi

      - name: Installa Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostra le versioni
        run: flutter --version

      - name: Genera i file Android mancanti
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter create --platforms=android --project-name dinamix --org com.dinamix .

      - name: Scarica le dipendenze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analisi del codice
        id: analyze
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Esegui i test
        id: tests
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Genera gli screenshot
        id: screenshots
        continue-on-error: true
        timeout-minutes: 6
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test --update-goldens --dart-define=SCREENSHOTS=true --timeout=90s test/screenshots_test.dart

      - name: Pubblica gli screenshot
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ env.PROJECT_DIR }}/test/screenshots
          retention-days: 7
          if-no-files-found: warn

      - name: Compila l'APK
        working-directory: ${{ env.PROJECT_DIR }}
        # The run number is the versionCode: every APK is newer than the previous one.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Android Lint
        id: lint
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: ./gradlew :app:lintRelease --no-daemon

      - name: Pubblica il rapporto Lint
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: lint
          path: ${{ env.PROJECT_DIR }}/build/app/reports/lint-results-release.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Rinomina l'APK
        run: mv "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" dinamix.apk

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v7
        with:
          path: dinamix.apk
          archive: false
          retention-days: 30
          if-no-files-found: error

      # The APK stays downloadable, but failed checks are never hidden.
      - name: Esito di analisi, test e screenshot
        if: steps.analyze.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.screenshots.outcome == 'failure'
        run: |
          echo "::error::APK creato, ma analisi, test o screenshot non sono passati. Non considerarlo verificato."
          exit 1

  # QA on an Android emulator (report §18). Separate job: the APK above stays
  # downloadable even if this fails, but a failure is never hidden.
  emulatore:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      - name: Trova la cartella del progetto
        run: |
          if [ -f dinamix_app.zip ]; then unzip -q -n dinamix_app.zip; fi
          echo "PROJECT_DIR=dinamix_app" >> "$GITHUB_ENV"

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Installa Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepara il progetto
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter create --platforms=android --project-name dinamix --org com.dinamix .
          flutter pub get

      - name: Scarica l'APK compilato
        uses: actions/download-artifact@v7
        with:
          name: dinamix.apk
          path: apk

      - name: Test su emulatore (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ${{ env.PROJECT_DIR }}
          script: bash tool/emulator_qa.sh "$(ls ../apk/*.apk | head -1)"

      - name: Pubblica i risultati QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-emulatore
          path: ${{ env.PROJECT_DIR }}/qa
          retention-days: 14
          if-no-files-found: warn
